document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 #0a0a0f; background: #ff006e; border: none; animation: av-pulse 1.8s ease-in-out infinite;\" style-hover=\"background: #f5ff00;\" style-active=\"transform: scale(0.95);\">JUGAR AHORA<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ curLocked }}\">\n                <button style=\"padding: 18px 26px; font-family: 'Press Start 2P', monospace; font-size: 12px; letter-spacing: 2px; color: #4a5160; background: #12141d; border: 1px solid rgba(255,255,255,0.1); cursor: not-allowed;\">PRONTO<\u002Fbutton>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ goLibrary }}\" style=\"cursor: pointer; padding: 18px 26px; font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: 1px; color: #00f5ff; background: transparent; border: 1px solid #00f5ff;\" style-hover=\"background: rgba(0,245,255,0.12); box-shadow: 0 0 22px rgba(0,245,255,0.35);\" style-active=\"transform: scale(0.95);\">VOLVER AL VAULT<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <aside style=\"padding: 22px; background: rgba(13,15,22,0.88); border: 1px solid rgba(255,0,110,0.3); box-shadow: 0 0 32px rgba(255,0,110,0.1);\">\n            <h3 style=\"margin: 0 0 18px; font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: 1px; color: #ff006e; text-shadow: 0 0 12px rgba(255,0,110,0.6);\">MEJORES PUNTUACIONES<\u002Fh3>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <sc-for list=\"{{ curBoard }}\" as=\"r\" hint-placeholder-count=\"10\">\n                <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 8px; background: {{ r.bg }}; border-left: 2px solid {{ r.accent }}; animation: av-row 0.4s ease both; animation-delay: {{ r.delay }};\">\n                  <span style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: {{ r.accent }};\">{{ r.rank }}<\u002Fspan>\n button>\n            <button sc-camel-on-click=\"{{ quitGame }}\" style=\"cursor: pointer; padding: 11px 14px; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ff006e; background: transparent; border: 1px solid rgba(255,0,110,0.45);\" style-hover=\"background: #ff006e; color: #0a0a0f;\" style-active=\"transform: scale(0.94);\">SALIR<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin: 26px auto 0; max-width: 620px; padding: 22px; background: linear-gradient(#15171f, #0b0c12); border: 1px solid rgba(0,245,255,0.22); border-radius: 34px; box-shadow: 0 0 46px rgba(0,245,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.04);\">\n          <div style=\"position: relative; overflow: hidden; border-radius: 22px; background: #05060a; box-shadow: inset 0 0 60px rgba(0,0,0,0.9), inset 0 0 12px rgba(0,245,255,0.16);\">\n            <canvas ref=\"{{ canvasRef }}\" width=\"480\" height=\"480\" style=\"display: block; width: 100%; height: auto; image-rendering: pixelated;\"><\u002Fcanvas>\n            <div style=\"position: absolute; inset: 0; pointer-events: none; border-radius: 22px; background: radial-gradient(115% 115% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.72) 100%);\"><\u002Fdiv>\n            <div style=\"position: absolute; inset: 0; pointer-events: none; height: 34%; background: linear-gradient(rgba(255,255,255,0) 0%, rgba(255,255,255,0.045) 55%, rgba(255,255,255,0) 100%); animation: av-sweep 5.5s linear infinite;\"><\u002Fdiv>\n            <sc-if value=\"{{ paused }}\">\n              <div style=\"position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,6,10,0.78);\">\n                <span style=\"font-family: 'Press Start 2P', monospace; font-size: clamp(14px, 3vw, 22px); letter-spacing: 2px; color: #f5ff00; text-shadow: 0 0 18px rgba(245,255,0,0.6);\">EN PAUSA<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 10px;\">\n            <sc-for list=\"{{ pad }}\" as=\"k\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-pointer-down=\"{{ k.down }}\" sc-camel-on-pointer-up=\"{{ k.up }}\" sc-camel-on-pointer-leave=\"{{ k.up }}\" style=\"cursor: pointer; padding: 15px 6px; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #00f5ff; background: #0f1119; border: 1px solid rgba(0,245,255,0.3); touch-action: none;\" style-active=\"background: #00f5ff; color: #0a0a0f;\">{{ k.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 0 0; text-align: center; font-size: 12px; letter-spacing: 1px; color: #545b6b;\">{{ curControls }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isScores }}\">\n      <section style=\"animation: av-fade 0.3s ease both;\">\n        <h2 style=\"margin: 0; text-align: center; font-family: 'Press Start 2P', monospace; font-size: clamp(18px, 4.6vw, 40px); line-height: 1.35; letter-spacing: 2px; color: #f5ff00; text-shadow: 0 0 14px rgba(245,255,0,0.7), 0 0 40px rgba(245,255,0,0.3);\">SALON DE LA FAMA<\u002Fh2>\n        <p style=\"margin: 18px 0 30px; text-align: center; font-size: 14px; letter-spacing: 1px; color: #6f7686;\">Las diez marcas más altas de cada máquina del vault.<\u002Fp>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;\">\n          <sc-for list=\"{{ scoreTabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ t.pick }}\" style=\"cursor: pointer; padding: 11px 13px; font-family: 'Press Start 2P', monospace; font-size: 8px; letter-spacing: 1px; color: {{ t.fg }}; background: {{ t.bg }}; border: 1px solid {{ t.bd }};\" style-hover=\"border-color: #f5ff00; color: #f5ff00;\" style-active=\"transform: scale(0.95);\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 28px; background: rgba(13,15,22,0.88); border: 1px solid rgba(0,245,255,0.22);\">\n          <div style=\"display: grid; grid-template-columns: 62px minmax(0, 1fr) 108px 96px; gap: 10px; padding: 14px 16px; background: #05060a; border-bottom: 1px solid rgba(0,245,255,0.22); font-family: 'Press Start 2P', monospace; font-size: 8px; letter-spacing: 1px; color: #00f5ff;\">\n            <span>RANGO<\u002Fspan>\n            <span>JUGADOR<\u002Fspan>\n            <span style=\"text-align: right;\">PUNTOS<\u002Fspan>\n            <span style=\"text-align: right;\">FECHA<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ hallBoard }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div style=\"display: grid; grid-template-columns: 62px minmax(0, 1fr) 108px 96px; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); background: {{ r.bg }}; animation: av-row 0.45s ease both; animation-delay: {{ r.delay }};\">\n              <span style=\"font-family: 'Press Start 2P', monospace; font-size: 11px; color: {{ r.accent }}; text-shadow: 0 0 10px {{ r.shadow }};\">{{ r.rank }}<\u002Fspan>\n              <span style=\"display: flex; align-items: center; gap: 10px; min-width: 0;\">\n                <span style=\"font-size: 14px; letter-spacing: 1px; color: #dbe1ee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ r.name }}<\u002Fspan>\n                <sc-if value=\"{{ r.isYou }}\">\n                  <span style=\"flex: none; padding: 4px 7px; font-family: 'Press Start 2P', monospace; font-size: 7px; color: #0a0a0f; background: #00f5ff;\">TU MEJOR MARCA<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"text-align: right; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #f5ff00;\">{{ r.score }}<\u002Fspan>\n              <span style=\"text-align: right; font-size: 12px; color: #6f7686;\">{{ r.date }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin: 18px 0 0; font-size: 12px; color: #4a5160; letter-spacing: 1px;\">Puntuaciones locales (localStorage). Punto de conexión previsto: GET /api/scores/:juego — REST o Supabase para usuarios autenticados.<\u002Fp>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAuth }}\">\n      <section style=\"display: grid; place-items: center; padding: clamp(10px, 4vw, 40px) 0; animation: av-fade 0.3s ease both;\">\n        <div style=\"width: min(100%, 440px); padding: clamp(22px, 4vw, 36px); background: rgba(13,15,22,0.92); border: 1px solid rgba(0,245,255,0.28); box-shadow: 0 0 44px rgba(0,245,255,0.12);\">\n          <div style=\"text-align: center; font-family: 'Press Start 2P', monospace; font-size: 15px; letter-spacing: 1px; color: #00f5ff; text-shadow: 0 0 12px rgba(0,245,255,0.8);\">ARCADE<span style=\"color: #ff006e; text-shadow: 0 0 12px rgba(255,0,110,0.8);\"> VAULT<\u002Fspan><\u002Fdiv>\n          <p style=\"margin: 14px 0 24px; text-align: center; font-size: 13px; color: #6f7686; letter-spacing: 1px;\">Guarda tus récords y compite en el salón.<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid rgba(0,245,255,0.25);\">\n            <button sc-camel-on-click=\"{{ tabLogin }}\" style=\"cursor: pointer; padding: 14px 8px; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; border: none; color: {{ loginFg }}; background: {{ loginBg }};\" style-active=\"transform: scale(0.97);\">INICIAR SESION<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ tabRegister }}\" style=\"cursor: pointer; padding: 14px 8px; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; border: none; color: {{ regFg }}; background: {{ regBg }};\" style-active=\"transform: scale(0.97);\">CREAR CUENTA<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 24px; display: flex; flex-direction: column; gap: 16px;\">\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 12px; letter-spacing: 1.4px; color: #8f97a8;\">Usuario\n              <input value=\"{{ authUser }}\" sc-camel-on-change=\"{{ onAuthUser }}\" placeholder=\"jugador_01\" style=\"padding: 13px; font-size: 14px; color: #e7ebf5; background: #05060a; border: 1px solid rgba(0,245,255,0.3); outline: none;\" style-focus=\"border-color: #00f5ff; box-shadow: 0 0 18px rgba(0,245,255,0.45);\">\n            <\u002Flabel>\n            <sc-if value=\"{{ isRegister }}\">\n              <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 12px; letter-spacing: 1.4px; color: #8f97a8;\">Correo electrónico\n                <input value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmail }}\" placeholder=\"tu@correo.com\" style=\"padding: 13px; font-size: 14px; color: #e7ebf5; background: #05060a; border: 1px solid rgba(0,245,255,0.3); outline: none;\" style-focus=\"border-color: #00f5ff; box-shadow: 0 0 18px rgba(0,245,255,0.45);\">\n              <\u002Flabel>\n            <\u002Fsc-if>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 12px; letter-spacing: 1.4px; color: #8f97a8;\">Contraseña\n              <input value=\"{{ authPass }}\" sc-camel-on-change=\"{{ onAuthPass }}\" type=\"password\" placeholder=\"••••••••\" style=\"padding: 13px; font-size: 14px; color: #e7ebf5; background: #05060a; border: 1px solid rgba(0,245,255,0.3); outline: none;\" style-focus=\"border-color: #00f5ff; box-shadow: 0 0 18px rgba(0,245,255,0.45);\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ submitAuth }}\" style=\"cursor: pointer; padding: 16px; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: #0a0a0f; background: #00f5ff; border: none; box-shadow: 0 0 22px rgba(0,245,255,0.5);\" style-hover=\"background: #f5ff00; box-shadow: 0 0 26px rgba(245,255,0,0.6);\" style-active=\"transform: scale(0.97);\">{{ authCta }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ playGuest }}\" style=\"cursor: pointer; padding: 15px; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; color: #ff006e; background: transparent; border: 1px solid rgba(255,0,110,0.5);\" style-hover=\"background: #ff006e; color: #0a0a0f;\" style-active=\"transform: scale(0.97);\">JUGAR COMO INVITADO<\u002Fbutton>\n            <p style=\"margin: 0; text-align: center; font-size: 11px; color: #545b6b; letter-spacing: 1px;\">Como invitado tus puntuaciones no se guardan en el servidor.<\u002Fp>\n\n            <div style=\"display: flex; align-items: center; gap: 12px; color: #3d4350; font-size: 11px; letter-spacing: 2px;\">\n              <span style=\"flex: 1; height: 1px; background: rgba(255,255,255,0.1);\"><\u002Fspan>O CONTINÚA CON<span style=\"flex: 1; height: 1px; background: rgba(255,255,255,0.1);\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px;\">\n              <button sc-camel-on-click=\"{{ socialGoogle }}\" style=\"cursor: pointer; padding: 14px 8px; font-family: 'Press Start 2P', monospace; font-size: 8px; letter-spacing: 1px; color: #9aa2b4; background: #0f1119; border: 1px solid rgba(255,255,255,0.14);\" style-hover=\"color: #00f5ff; border-color: rgba(0,245,255,0.5);\" style-active=\"transform: scale(0.96);\">GOOGLE<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ socialGithub }}\" style=\"cursor: pointer; padding: 14px 8px; font-family: 'Press Start 2P', monospace; font-size: 8px; letter-spacing: 1px; color: #9aa2b4; background: #0f1119; border: 1px solid rgba(255,255,255,0.14);\" style-hover=\"color: #00f5ff; border-color: rgba(0,245,255,0.5);\" style-active=\"transform: scale(0.96);\">GITHUB<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin: 4px 0 0; font-size: 11px; color: #3d4350; letter-spacing: 1px;\">Sesión simulada en este dispositivo. Conectar aquí: POST /api/auth/login · OAuth Google/GitHub vía Supabase.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ loading }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; gap: 20px; background: rgba(5,6,10,0.94);\">\n      <div style=\"display: grid; gap: 18px; justify-items: center;\">\n        <div style=\"width: 54px; height: 54px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; animation: av-spin 0.9s steps(8) infinite;\">\n          <span style=\"background: #00f5ff; box-shadow: 0 0 12px #00f5ff;\"><\u002Fspan>\n          <span style=\"background: #ff006e; box-shadow: 0 0 12px #ff006e;\"><\u002Fspan>\n          <span style=\"background: #f5ff00; box-shadow: 0 0 12px #f5ff00;\"><\u002Fspan>\n          <span style=\"background: #00f5ff; box-shadow: 0 0 12px #00f5ff;\"><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 2px; color: #00f5ff;\">CARGANDO CARTUCHO...<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ over }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: 20px; background: rgba(5,6,10,0.9);\">\n      <div style=\"width: min(100%, 460px); padding: clamp(22px, 4vw, 34px); text-align: center; background: #0d0f16; border: 1px solid rgba(255,0,110,0.45); box-shadow: 0 0 48px rgba(255,0,110,0.22); animation: av-fade 0.24s ease both;\">\n        <h3 style=\"margin: 0; font-family: 'Press Start 2P', monospace; font-size: clamp(15px, 3.6vw, 24px); letter-spacing: 2px; color: #ff006e; text-shadow: 0 0 16px rgba(255,0,110,0.7);\">FIN DEL JUEGO<\u002Fh3>\n        <p style=\"margin: 20px 0 6px; font-size: 12px; letter-spacing: 2px; color: #6f7686;\">PUNTUACIÓN FINAL<\u002Fp>\n        <p style=\"margin: 0; font-family: 'Press Start 2P', monospace; font-size: clamp(24px, 6vw, 40px); color: #f5ff00; text-shadow: 0 0 18px rgba(245,255,0,0.6);\">{{ hudScore }}<\u002Fp>\n        <p style=\"margin: 14px 0 22px; font-size: 13px; letter-spacing: 1px; color: #8f97a8;\">{{ overNote }}<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-if value=\"{{ canSave }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ saveScore }}\" style=\"cursor: pointer; padding: 15px; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: #0a0a0f; background: #f5ff00; border: none; box-shadow: 0 0 22px rgba(245,255,0,0.45);\" style-hover=\"background: #00f5ff;\" style-active=\"transform: scale(0.96);\">GUARDAR PUNTUACION<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ saved }}\">\n            <p style=\"margin: 0; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: #00f5ff; text-shadow: 0 0 12px rgba(0,245,255,0.6);\">{{ savedText }}<span style=\"animation: av-caret 0.9s steps(1) infinite;\">_<\u002Fspan><\u002Fp>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ replay }}\" style=\"cursor: pointer; padding: 15px; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: #ff006e; background: transparent; border: 1px solid #ff006e;\" style-hover=\"background: #ff006e; color: #0a0a0f;\" style-active=\"transform: scale(0.96);\">JUGAR DE NUEVO<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ quitGame }}\" style=\"cursor: pointer; padding: 15px; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: #00f5ff; background: transparent; border: 1px solid rgba(0,245,255,0.5);\" style-hover=\"background: rgba(0,245,255,0.14);\" style-active=\"transform: scale(0.96);\">VOLVER AL VAULT<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"position: relative; z-index: 2; padding: 22px clamp(14px, 3vw, 40px) 34px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 11px; letter-spacing: 1.4px; color: #3d4350; text-align: center;\">ARCADE VAULT · 8 MÁQUINAS · INSERTA UNA MONEDA<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showScanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Pantalla&quot;},&quot;animatedGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Pantalla&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;biblioteca&quot;,&quot;salon&quot;,&quot;cuenta&quot;],&quot;default&quot;:&quot;biblioteca&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navegación&quot;},&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;facil&quot;,&quot;normal&quot;,&quot;dificil&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Juego&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'arcadevault:v1';\n  canvasRef = React.createRef();\n  keys = {};\n\n  GAMES = [\n    { id: 'muro', title: 'MURO NEON', letter: 'M', cat: 'ARCADE', glow: '#00f5ff', playable: true,\n      desc: 'Rompe cada ladrillo sin perder la bola.',\n      long: 'Una pala, una bola y un muro de luz que no perdona. Cada nivel acelera la bola y reduce tu margen de error. Limpia la pantalla completa para pasar al siguiente muro.',\n      controls: 'Flechas ← → para mover la pala · ESPACIO para lanzar' },\n    { id: 'serpiente', title: 'SERPIENTE 64', letter: 'S', cat: 'CLASICOS', glow: '#f5ff00', playable: true,\n      desc: 'Crece sin morder tu propia cola.',\n      long: 'El clásico de rejilla llevado al vault. Cada fruta suma diez puntos y un segmento más de cuerpo. La velocidad crece con tu longitud, así que la codicia se paga caro.',\n      controls: 'Flechas ← ↑ → ↓ para girar' },\n    { id: 'invasores', title: 'INVASORES DEL VACIO', letter: 'I', cat: 'DISPAROS', glow: '#ff006e', playable: true,\n      desc: 'Defiende la última base orbital.',\n      long: 'Formaciones enemigas descienden en oleadas cada vez más rápidas. Dispara, esquiva y aguanta: cada oleada limpiada te da un nivel y una salva más agresiva en contra.',\n      controls: 'Flechas ← → para moverte · ESPACIO para disparar' },\n    { id: 'rocas', title: 'CINTURON DE ROCAS', letter: 'R', cat: 'DISPAROS', glow: '#00f5ff', playable: true,\n      desc: 'Vuela entre asteroides y pulverízalos.',\n      long: 'Inercia real: la nave no frena sola. Los asteroides grandes se parten en fragmentos más rápidos, y el campo se repuebla en cuanto lo despejas. Tres vidas, ningún escudo.',\n      controls: 'Flechas ← → giran · ↑ empuja · ESPACIO dispara' },\n    { id: 'duelo', title: 'DUELO DE PALAS', letter: 'D', cat: 'ARCADE', glow: '#f5ff00', playable: true,\n      desc: 'Uno contra la máquina, sin piedad.',\n      long: 'El duelo más antiguo del vault: dos palas, una bola y ningún sitio donde esconderse. La máquina aprende el ángulo de tu golpe y cada punto acelera el intercambio. Tres fallos y se apaga la mesa.',\n      controls: 'Flechas ↑ ↓ para mover tu pala' },\n    { id: 'corredor', title: 'CORREDOR DE NEON', letter: 'C', cat: 'REFLEJOS', glow: '#ff006e', playable: true,\n      desc: 'Salta los bloques y no mires atrás.',\n      long: 'Una carrera infinita por una autopista de rejilla. Los bloques llegan cada vez más rápido y la distancia es tu única puntuación. Salta en el instante justo: el suelo no perdona dos veces.',\n      controls: 'ESPACIO o ↑ para saltar · ↓ para caer rápido' },\n    { id: 'caida', title: 'CAIDA VERTICAL', letter: 'C', cat: 'PUZZLE', glow: '#ff006e', playable: false,\n      desc: 'Encaja las piezas antes de que se apilen.',\n      long: 'Piezas que caen, líneas que desaparecen y una velocidad que nunca baja. Máquina en mantenimiento: la ROM se está reescribiendo para el vault.',\n      controls: 'Pendiente de calibración' },\n    { id: 'laberinto', title: 'LABERINTO GLOTON', letter: 'L', cat: 'LABERINTO', glow: '#f5ff00', playable: false,\n      desc: 'Recoge cada punto y esquiva a los guardianes.',\n      long: 'Pasillos cerrados, cuatro perseguidores y un cronómetro implacable. Máquina en mantenimiento: los guardianes aún no tienen rutas asignadas.',\n      controls: 'Pendiente de calibración' }\n  ];\n\n  SEED = {\n    muro: [['NEOKID', 18420], ['R3TR0', 15980], ['LUCIA_X', 14210], ['DONPIXEL', 12760], ['MARIO_88', 11340], ['ZURDA', 9820], ['KIKO', 8410], ['VIOLETA', 7260], ['ELENA', 6180], ['TITO', 5040]],\n    serpiente: [['VIBORA', 9640], ['SARA_9', 8720], ['CTRL_ALT', 7910], ['NANDO', 6880], ['PIXELINA', 6120], ['JOSU', 5340], ['ANDREA', 4610], ['RUBEN', 3980], ['MAR', 3220], ['IVAN', 2640]],\n    invasores: [['ORBITA', 24680], ['CAPI_Z', 21440], ['LAIA', 19870], ['GUS', 17250], ['DIEGO_R', 15600], ['NURIA', 13980], ['BEA', 12100], ['OSCAR', 10420], ['PACO', 8760], ['LOLA', 7140]],\n    rocas: [['ASTRA', 31200], ['DUNA', 27640], ['KAI', 24980], ['ROCIO', 22310], ['TOMAS', 19740], ['SILVIA', 17020], ['BRUNO', 14680], ['NOA', 12240], ['HUGO', 9910], ['EMMA', 7830]],\n    duelo: [['PALA_X', 4200], ['CARLA', 3800], ['MENDI', 3400], ['RAUL_7', 3100], ['NEREA', 2700], ['TONI', 2300], ['JULIA', 1900], ['ABEL', 1600], ['SAM', 1200], ['NIL', 900]],\n    corredor: [['VELOZ', 12840], ['MARTA_R', 11260], ['KEVIN', 9980], ['AITOR', 8740], ['CLARA', 7620], ['IZAN', 6480], ['PILAR', 5310], ['BORJA', 4260], ['ROC', 3180], ['ELSA', 2140]],\n    caida: [['TETRO', 14200], ['ANA_L', 12680], ['JAVI', 10940], ['CARMEN', 9320], ['LEO', 8100], ['MIRA', 6840], ['SAUL', 5620], ['ITZI', 4380], ['POL', 3260], ['UNAI', 2180]],\n    laberinto: [['GLOTON', 16880], ['ROSA', 14320], ['ALEX_P', 12760], ['CHEMA', 11040], ['SOFIA', 9580], ['DANI', 8210], ['LUZ', 6940], ['MARCOS', 5620], ['IRIS', 4380], ['JON', 3140]]\n  };\n\n  DATES = ['12/04/26', '28/03/26', '09/03/26', '21/02/26', '14/02/26', '02/02/26', '19/01/26', '07/01/26', '23/12/25', '11/12/25'];\n\n  state = {\n    screen: null, query: '', cat: 'TODOS', gameId: null, scoresTab: 'muro',\n    user: null, authTab: 'login', au: '', ap: '', ae: '',\n    menuOpen: false, loading: false, paused: false, over: false,\n    saved: false, savedText: '', scores: {}, w: 1240,\n    hud: { score: 0, lives: 3, level: 1 }\n  };\n\n  componentDidMount() {\n    const d = this.read();\n    this.setState({ user: d.user || null, scores: d.scores || {}, w: window.innerWidth });\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onDown = (e) => {\n      if (this.state.screen !== 'play') return;\n      this.keys[e.key] = true;\n      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();\n    };\n    this.onUp = (e) => { this.keys[e.key] = false; };\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('keydown', this.onDown);\n    window.addEventListener('keyup', this.onUp);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onDown);\n    window.removeEventListener('keyup', this.onUp);\n    this.stop();\n    clearInterval(this.typer);\n    clearTimeout(this.loadT);\n  }\n\n  componentDidUpdate() {\n    if (this.state.screen === 'play' && !this.state.loading && !this.state.over && !this.running) this.start();\n    if (this.state.screen !== 'play' && this.running) this.stop();\n  }\n\n  read() { try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { return {}; } }\n  persist(patch) {\n    const d = Object.assign(this.read(), patch);\n    try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {}\n  }\n\n  game(id) { return this.GAMES.filter(g => g.id === id)[0] || this.GAMES[0]; }\n  tint(hex, a) {\n    const n = parseInt(hex.slice(1), 16);\n    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';\n  }\n\n  board(id) {\n    const seed = (this.SEED[id] || []).map((r, i) => ({ name: r[0], score: r[1], date: this.DATES[i] || '01/01/26', mine: false }));\n    const mine = (this.state.scores[id] || []).map(r => ({ name: r.name, score: r.score, date: r.date, mine: true }));\n    return seed.concat(mine).sort((a, b) => b.score - a.score).slice(0, 10);\n  }\n\n  /* ---- mini previews for cards / detail hero ---- */\n  previewRef(id) {\n    return (el) => {\n      if (!el) return;\n      const ctx = el.getContext('2d');\n      this.drawPreview(ctx, id, el.width, el.height);\n    };\n  }\n\n  drawPreview(ctx, id, W, H) {\n    const px = (c, x, y, w, h) => { ctx.save(); ctx.shadowBlur = W / 24; ctx.shadowColor = c; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); ctx.restore(); };\n    const ring = (c, x, y, r) => { ctx.save(); ctx.shadowBlur = W / 24; ctx.shadowColor = c; ctx.strokeStyle = c; ctx.lineWidth = Math.max(1.5, W / 130); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); };\n    const g = ctx.createLinearGradient(0, 0, 0, H);\n    g.addColorStop(0, '#0a0c14'); g.addColorStop(1, '#05060a');\n    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);\n    const u = W / 100;\n\n    if (id === 'muro') {\n      const cols = 8, rows = 3, bw = W / cols, bh = H * 0.11, cs = ['#00f5ff', '#ff006e', '#f5ff00'];\n      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {\n        if (r === 2 && (c === 2 || c === 5)) continue;\n        px(cs[r], c * bw + u, H * 0.12 + r * bh + u * 0.6, bw - u * 2, bh - u * 1.4);\n      }\n      px('#00f5ff', W * 0.36, H * 0.86, W * 0.28, H * 0.05);\n      px('#f5ff00', W * 0.56, H * 0
